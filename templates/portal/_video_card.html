{% load vone_ui %}{% if item.file %}<article class="mcard"><video class="vid" controls preload="none" playsinline {% if item.cover_image %}poster="{{ item.cover_image.url }}"{% endif %} aria-label="{{ item.title }}"><source src="{{ item.file.url }}" type="{% if item.file.name|lower|slice:'-5:' == '.webm' %}video/webm{% else %}video/mp4{% endif %}"></video>
  <button type="button" class="bm bm-over" data-bookmark="{{ item.pk }}" aria-pressed="{% if item.pk in shell_bookmarks %}true{% else %}false{% endif %}" aria-label="Bookmark {{ item.title }}" title="Bookmark">{% icon 'bookmark' %}</button>
  <div class="mbody"><span class="pill grey" style="align-self:flex-start">{{ item.get_kind_display }}</span><h3>{{ item.title }}</h3>{% if item.summary %}<p>{{ item.summary }}</p>{% endif %}<div class="mfoot"><span>{{ item.published_at|date:"d M Y" }}</span></div></div></article>{% else %}{% include 'portal/_resource_card.html' %}{% endif %}
