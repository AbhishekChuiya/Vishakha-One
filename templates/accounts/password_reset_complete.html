{% extends "accounts/auth_base.html" %}
{% block title %}Password changed{% endblock %}
{% block content %}
<div class="vauth-icon ok"><svg class="vi" aria-hidden="true"><use href="#vi-check-circle"/></svg></div>
<h2>Password changed</h2>
<p class="vlead">Your password has been updated. You can now sign in.</p>
<a class="vbtn lg block" href="{% url 'accounts:login' %}">Go to sign in <svg class="vi" aria-hidden="true"><use href="#vi-arrow-right"/></svg></a>
{% endblock %}
